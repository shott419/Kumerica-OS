<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUMERICA-OS - By Gunshot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f0f;color:white;min-height:100vh}
.header{background:linear-gradient(90deg,#FFD700 0%,#1a1a1a 50%,#00A651 100%);padding:40px 20px;text-align:center}
.header h1{font-size:2.5rem;letter-spacing:2px}
.container{max-width:600px;margin:0 auto;padding:20px}
.card{background:#1e1e1e;border-radius:16px;padding:24px;margin-bottom:20px;border-left:5px solid #FFD700;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.card h2{font-size:1.5rem;margin-bottom:20px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
input,select{width:100%;padding:14px;border-radius:10px;border:none;background:#2a2a2a;color:white;font-size:1rem;text-align:center}
.btn{display:block;margin:0 auto;background:#FFD700;color:black;font-weight:bold;border:none;padding:14px 32px;border-radius:30px;font-size:1.1rem;cursor:pointer}
.result{margin-top:16px;padding:14px;background:#2a2a2a;border-radius:10px;text-align:center;display:none;font-size:1.1rem;line-height:1.5}
.result.show{display:block}
.momo{background:#FFD700;color:black;padding:18px;border-radius:12px;text-align:center;font-weight:bold;font-size:1.2rem}
</style>
</head>
<body>
<div class="header">
<h1>💛 KUMERICA-OS 🖤💚</h1>
<p>By Gunshot - Kumerica To The Whole Wiase</p>
</div>
<div class="container">
<div class="card">
<h2>📚 BECE Calculator</h2>
<p style="font-size:0.85rem;color:#aaa;text-align:center;margin-bottom:12px">Enter grades 1(best)-9(worst)</p>
<div class="grid">
<input type="number" id="b1" placeholder="English" min="1" max="9">
<input type="number" id="b2" placeholder="Maths" min="1" max="9">
<input type="number" id="b3" placeholder="Science" min="1" max="9">
<input type="number" id="b4" placeholder="Social" min="1" max="9">
<input type="number" id="b5" placeholder="Sub5" min="1" max="9">
<input type="number" id="b6" placeholder="Sub6" min="1" max="9">
</div>
<button class="btn" onclick="calcBECE()">Calc BECE</button>
<div id="beceRes" class="result"></div>
</div>
<div class="card">
<h2>🎓 WASSCE Calculator</h2>
<div class="grid">
<select id="w1"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select>
<select id="w2"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select>
<select id="w3"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select>
<select id="w4"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select>
<select id="w5"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select>
<select id="w6"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select>
</div>
<button class="btn" onclick="calcWASSCE()">Calc WASSCE</button>
<div id="wassceRes" class="result"></div>
</div>
<div class="card">
<div class="momo">MTN MoMo: 0551997304<br>Gunshot O Kn</div>
</div>
</div>
<script>
function calcBECE(){
 let vals=[];
 for(let i=1;i<=6;i++){
  let v=parseInt(document.getElementById('b'+i).value);
  if(!v||v<1||v>9){alert('Enter 1-9 for all 6!');return;}
  vals.push(v);
 }
 let agg=vals.reduce((a,b)=>a+b,0);
 let remark=agg<=12?'🔥 EXCELLENT! SHS go like you!':agg<=20?'✅ VERY GOOD!':agg<=30?'👍 GOOD':agg<=36?'😅 FAIR':'💪 TRY AGAIN';
 document.getElementById('beceRes').innerHTML=`<b>Aggregate: ${agg}</b><br>Grades: ${vals.join(', ')}<br><br>${remark}`;
 document.getElementById('beceRes').classList.add('show');
}
function calcWASSCE(){
 let vals=[];
 for(let i=1;i<=6;i++){vals.push(parseInt(document.getElementById('w'+i).value));}
 let agg=vals.reduce((a,b)=>a+b,0);
 let remark=agg<=12?'🔥 BEAST! University go beg you!':agg<=20?'✅ EXCELLENT!':agg<=24?'👍 VERY GOOD!':agg<=36?'😅 GOOD':'💪 Try NovDec';
 document.getElementById('wassceRes').innerHTML=`<b>Aggregate: ${agg}</b><br><br>${remark}`;
 document.getElementById('wassceRes').classList.add('show');
}
</script>
</body>
</html>
