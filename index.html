<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kumerica-OS</title><style>body{margin:0;font-family:sans-serif;background:#0f0f0f;color:#fff;text-align:center}.header{background:linear-gradient(90deg,#FFD700,#111,#00A000);padding:30px}.card{background:#1c1c1c;margin:20px;padding:20px;border-radius:12px;border-left:5px solid #FFD700}.btn{padding:12px 20px;background:#FFD700;color:#000;text-decoration:none;font-weight:800;border-radius:20px;margin:5px;display:inline-block}.momo{background:#FFD700;color:#000;padding:15px;border-radius:10px;font-size:20px;font-weight:900}input,select{padding:10px;margin:5px;border-radius:6px;border:none;width:100px}</style></head><body><div class="header"><h1>💛 KUMERICA-OS 🖤💚</h1><p>By Gunshot - Kumerica To The Whole Wiase</p></div><div class="card"><h2>📚 BECE Calculator</h2><div id="b"></div><button class="btn" onclick="calcB()">Calc BECE</button><div id="rb"></div></div><div class="card"><h2>🎓 WASSCE Calculator</h2><div id="w"></div><button class="btn" onclick="calcW()">Calc WASSCE</button><div id="rw"></div></div><div class="card"><div class="momo">MTN MoMo: 0551997304<br>Gunshot O Kn</div></div><script>let bd=document.getElementById('b');for(let i=0;i<6;i++)bd.innerHTML+=`<input type="number" id="b${i}" min="1" max="9" placeholder="Sub${i+1}">`;function calcB(){let v=[];for(let i=0;i<6;i++)v.push(parseInt(document.getElementById('b'+i).value)||9);let a=(v.reduce((x,y)=>x+y)/6).toFixed(2);document.getElementById('rb').innerHTML="Average: "+a}let wd=document.getElementById('w');let g=["A1","B2","B3","C4","C5","C6","D7","E8","F9"];for(let i=0;i<6;i++){let s=`<select id="w${i}">`;g.forEach(x=>s+=`<option>${x}</option>`);s+=`</select>`;wd.innerHTML+=s}let m={A1:1,B2:2,B3:3,C4:4,C5:5,C6:6,D7:7,E8:8,F9:9};function calcW(){let t=0;for(let i=0;i<6;i++)t+=m[document.getElementById('w'+i).value];document.getElementById('rw').innerHTML="Aggregate: "+t}</script></body></html>
